name: Build APK

on:
  workflow_run:
    workflows: ["Extract Repo Source to TXT"]
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ============================================================
      # LOCAL PROPERTIES
      # ============================================================
      - name: Write local.properties
        run: |
          echo "telegram_bot_token=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> local.properties

      # ============================================================
      # JAVA
      # ============================================================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ============================================================
      # GRADLE CACHE
      # ============================================================
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ============================================================
      # RESTORE PERMANENT CHECKMATE SIGNING KEY
      # ============================================================
      - name: Restore Checkmate CI signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.CHECKMATE_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::CHECKMATE_KEYSTORE_B64 is not configured"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/checkmate-signing"

          echo "$KEYSTORE_B64" | base64 --decode \
            > "$RUNNER_TEMP/checkmate-signing/checkmate-ci-debug.jks"

          chmod 600 "$RUNNER_TEMP/checkmate-signing/checkmate-ci-debug.jks"

          test -s "$RUNNER_TEMP/checkmate-signing/checkmate-ci-debug.jks"

          echo "CHECKMATE_KEYSTORE=$RUNNER_TEMP/checkmate-signing/checkmate-ci-debug.jks" >> "$GITHUB_ENV"

      # ============================================================
      # VERIFY KEYSTORE BEFORE BUILD
      # ============================================================
      - name: Verify Checkmate signing keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.CHECKMATE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CHECKMATE_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::CHECKMATE_KEYSTORE_PASSWORD is not configured"
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "::error::CHECKMATE_KEY_ALIAS is not configured"
            exit 1
          fi

          keytool -list \
            -v \
            -keystore "$CHECKMATE_KEYSTORE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            > "$RUNNER_TEMP/checkmate-keystore-info.txt"

          echo "Permanent Checkmate signing certificate:"
          grep -E \
            "Owner:|SHA256:|SHA256with|Valid from:" \
            "$RUNNER_TEMP/checkmate-keystore-info.txt" || true

      # ============================================================
      # BUILD
      # ============================================================
      - name: Build Debug APK and capture log
        id: gradle_build
        continue-on-error: true
        env:
          CHECKMATE_KEYSTORE: ${{ env.CHECKMATE_KEYSTORE }}
          CHECKMATE_KEYSTORE_PASSWORD: ${{ secrets.CHECKMATE_KEYSTORE_PASSWORD }}
          CHECKMATE_KEY_ALIAS: ${{ secrets.CHECKMATE_KEY_ALIAS }}
          CHECKMATE_KEY_PASSWORD: ${{ secrets.CHECKMATE_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          mkdir -p build_error_logs

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            2>&1 | tee build_error_logs/build_output.txt

          EXIT_CODE=${PIPESTATUS[0]}

          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

      # ============================================================
      # VERIFY APK SIGNATURE
      # ============================================================
      - name: Verify APK signing certificate
        if: steps.gradle_build.outputs.exit_code == '0'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.CHECKMATE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CHECKMATE_KEY_ALIAS }}
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::APK was not produced"
            exit 1
          fi

          echo "=== APK SIGNATURE ==="

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            --print-certs \
            "$APK"

          echo
          echo "=== KEYSTORE CERTIFICATE ==="

          keytool -list \
            -v \
            -keystore "$CHECKMATE_KEYSTORE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            | grep -E \
              "Owner:|SHA256:|SHA256with|Valid from:" || true

      # ============================================================
      # UPLOAD APK
      # ============================================================
      - name: Upload Debug APK
        if: steps.gradle_build.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # ============================================================
      # ENHANCED ERROR EXTRACTION
      # ============================================================
      - name: Extract errors
        if: steps.gradle_build.outputs.exit_code != '0'
        run: |
          mkdir -p build_error_logs

          {
            echo "==== GRADLE BUILD ERROR REPORT ===="
            echo

            echo "-- CMAKE CONFIGURATION ERRORS --"
            grep -A 5 "CMake Error" \
              build_error_logs/build_output.txt \
              || echo "No CMake errors"
            echo

            echo "-- NINJA BUILD ERRORS --"
            grep -B 3 -A 3 "ninja: build stopped" \
              build_error_logs/build_output.txt \
              || echo "No ninja errors"
            echo

            echo "-- C++ COMPILATION ERRORS --"
            grep -E \
              "error: |undefined reference|fatal error:" \
              build_error_logs/build_output.txt \
              | head -50 \
              || echo "No C++ errors"
            echo

            echo "-- MISSING HEADERS/LIBRARIES --"
            grep -E \
              "No such file|cannot find|ld returned" \
              build_error_logs/build_output.txt \
              || echo "No missing deps"
            echo

            echo "-- KOTLIN/JAVA ERRORS --"
            grep -E \
              "\.kt:[0-9]+:[0-9]+ error|\.java:[0-9]+: error|^e: " \
              build_error_logs/build_output.txt \
              || echo "No Kotlin/Java errors"
            echo

            echo "-- XML RESOURCE ERRORS --"
            grep -E \
              "\.xml:[0-9]+:" \
              build_error_logs/build_output.txt \
              || echo "No XML errors"
            echo

            echo "-- BUILD TASK FAILURES --"
            grep -E \
              "BUILD FAILED|FAILURE: Build failed|Task.*FAILED" \
              build_error_logs/build_output.txt \
              || echo "No task failures"
            echo

            echo "-- EXCEPTION STACK TRACES --"
            grep -A 10 "Exception" \
              build_error_logs/build_output.txt \
              | head -100 \
              || echo "No exceptions"

            echo
            echo "-- NATIVE BUILD LOG --"
            grep -E \
              "(Building CXX|Linking CXX|CMake|ninja)" \
              build_error_logs/build_output.txt \
              | tail -100 \
              || echo "No native build log"

          } > build_error_logs/error_summary.txt

          tail -1000 \
            build_error_logs/build_output.txt \
            > build_error_logs/build_tail.txt

          echo "==== ERROR SUMMARY ===="
          cat build_error_logs/error_summary.txt

      # ============================================================
      # ERROR SOURCE EXTRACTION
      # ============================================================
      - name: Extract source code of error files
        if: steps.gradle_build.outputs.exit_code != '0'
        run: |
          python3 << 'PYTHON_SCRIPT'
          import re
          import os
          from collections import defaultdict

          ERROR_LOG = "build_error_logs/build_output.txt"
          OUTPUT = "build_error_logs/error_files.txt"
          REPO_ROOT = os.getcwd()

          with open(ERROR_LOG, "r", encoding="utf-8", errors="ignore") as f:
              error_log = f.read()

          error_map = defaultdict(list)

          def normalize_path(filepath):
              filepath = re.sub(r"^file:/+", "", filepath)
              filepath = filepath.lstrip("/")

              match = re.search(
                  r"/home/runner/work/[^/]+/[^/]+/(.+)",
                  filepath
              )

              if match:
                  filepath = match.group(1)

              match = re.search(
                  r"home/runner/work/[^/]+/[^/]+/(.+)",
                  filepath
              )

              if match:
                  filepath = match.group(1)

              return filepath

          patterns = [
              (
                  r"e:\s+(?:file://)?([^\s:]+\.kt):(\d+):(\d+)\s+(.+)",
                  1, 2, 4
              ),
              (
                  r"([a-zA-Z0-9_./\-]+\.java):(\d+):\s+error:\s+(.+)",
                  1, 2, 3
              ),
              (
                  r"([a-zA-Z0-9_./\-]+\.xml):(\d+):(\d+):\s+(.+)",
                  1, 2, 4
              ),
              (
                  r"([a-zA-Z0-9_./\-]+\.(cpp|c|h|hpp)):(\d+):(\d+):\s+error:\s+(.+)",
                  1, 3, 5
              ),
          ]

          for pattern, path_i, line_i, msg_i in patterns:
              for match in re.finditer(pattern, error_log):
                  filepath = normalize_path(match.group(path_i))
                  line_num = int(match.group(line_i))
                  error_msg = match.group(msg_i).strip()
                  error_map[filepath].append(
                      (line_num, error_msg)
                  )

          with open(OUTPUT, "w", encoding="utf-8") as out:
              out.write(
                  "==== SOURCE CODE "
                  "(ERROR FILES WITH HIGHLIGHTED LINES) ====\n\n"
              )

              if not error_map:
                  out.write("No error files detected\n")

              for filepath in sorted(error_map):
                  actual_path = os.path.join(REPO_ROOT, filepath)

                  if not os.path.isfile(actual_path):
                      out.write(
                          f"//===== FILE: {filepath} "
                          "(NOT FOUND) =====\n"
                      )
                      out.write(
                          f"// Expected at: {actual_path}\n\n"
                      )
                      continue

                  out.write(
                      f"//===== FILE: {filepath} =====\n\n"
                  )

                  errors = sorted(set(error_map[filepath]))

                  out.write(
                      f"// ERRORS IN THIS FILE "
                      f"({len(errors)} error(s)):\n"
                  )

                  for line_num, msg in errors:
                      out.write(
                          f"// Line {line_num}: {msg}\n"
                      )

                  out.write("\n")

                  error_lines = {
                      line_num for line_num, _ in errors
                  }

                  with open(
                      actual_path,
                      "r",
                      encoding="utf-8",
                      errors="ignore"
                  ) as f:
                      for line_num, line in enumerate(f, 1):
                          line = line.rstrip("\n\r")

                          marker = "❌" if line_num in error_lines else "  "

                          out.write(
                              f"{line_num:4d} {marker} {line}\n"
                          )

                  out.write("\n\n")

          with open(
              "build_error_logs/error_file_list.txt",
              "w"
          ) as f:
              for filepath in sorted(error_map):
                  f.write(filepath + "\n")

          print(
              f"Detected {len(error_map)} error file(s)"
          )
          PYTHON_SCRIPT

      # ============================================================
      # COMMIT ERROR REPORT
      # ============================================================
      - name: Commit & push error report
        if: steps.gradle_build.outputs.exit_code != '0'
        run: |
          git config user.name "build-error-bot"
          git config user.email "bot@users.noreply.github.com"

          git add build_error_logs/

          if git diff --cached --quiet; then
            echo "No error-report changes to commit"
            exit 0
          fi

          git commit \
            -m "Build failed - error report (exit code: ${{ steps.gradle_build.outputs.exit_code }} )"

          git push origin HEAD:main || {
            echo "::warning::Unable to push error report"
          }

      # ============================================================
      # ERROR ARTIFACT
      # ============================================================
      - name: Upload error logs as artifact
        if: steps.gradle_build.outputs.exit_code != '0'
        uses: actions/upload-artifact@v4
        with:
          name: build-error-logs
          path: build_error_logs/
          retention-days: 30

      # ============================================================
      # FINAL FAILURE
      # ============================================================
      - name: Mark build as failed
        if: steps.gradle_build.outputs.exit_code != '0'
        run: |
          echo "::error::Build failed with exit code ${{ steps.gradle_build.outputs.exit_code }}"
          exit 1
